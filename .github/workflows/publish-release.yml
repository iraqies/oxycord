name: Publish release

# Push a branch named publish/<anything> that holds:
#   release/meta.env   TAG=..., TITLE=..., optional LATEST=false
#   release/notes.md   the release notes
#   release/files/     every file to attach
# The release is tagged on the default branch and the publish branch is deleted
# afterwards, so the binaries never stay in the repository history.

on:
  push:
    branches:
      - 'publish/**'

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source release/meta.env
          : "${TAG:?release/meta.env needs TAG}" "${TITLE:?release/meta.env needs TITLE}"
          latest="--latest=${LATEST:-true}"
          cd release/files
          sha256sum ./* | sed 's| \./| |' > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already exists, uploading the files again"
            gh release upload "$TAG" ./* --clobber
          else
            gh release create "$TAG" --target "$DEFAULT_BRANCH" \
              --title "$TITLE" --notes-file ../notes.md "$latest" ./*
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | "\(.name) \(.size)")'

      - name: Remove publish branch
        if: success()
        run: git push origin --delete "$GITHUB_REF_NAME"
